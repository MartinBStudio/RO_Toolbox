[package]
name = "ro_toolbox_desktop"
version = "0.1.1"
description = "RO Toolbox desktop shell"
authors = ["BStudio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
