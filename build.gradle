plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bstudio'
version = readVersionFromProperties()
description = 'RO_Toolbox'

def readVersionFromProperties() {
    def propsFile = file('src/main/resources/application.properties')
    def version = 'dev'
    if (propsFile.exists()) {
        propsFile.eachLine { line ->
            if (line.startsWith('app.version=')) {
                version = line.substring('app.version='.length()).trim()
            }
        }
    }
    return version
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('jar') {
    archiveBaseName = 'RO_Toolbox'
    archiveVersion = project.version.toString()
}

tasks.named('bootJar') {
    archiveBaseName = 'RO_Toolbox'
    archiveVersion = project.version.toString()
    mainClass = 'com.bstudio.ro_toolbox.RoToolboxApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}
